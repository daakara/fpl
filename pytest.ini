# Enhanced Pytest Configuration for FPL Analytics
[pytest]
minversion = 6.0
addopts = 
    -ra
    --strict-markers 
    --strict-config 
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --maxfail=5
    --tb=short
    -v

testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Custom markers for different test types
markers =
    unit: Unit tests - fast, isolated tests
    integration: Integration tests - test component interactions
    slow: Slow tests - may take longer to execute
    api: API tests - require internet connection
    ui: UI tests - test user interface components
    performance: Performance tests - test speed and memory usage
    asyncio: Async tests - require asyncio event loop
    database: Database tests - require database connection
    cache: Cache tests - test caching functionality
    ml: Machine learning tests - test ML models and predictions
    security: Security tests - test authentication and authorization

# Test collection and execution
collect_ignore = [
    "setup.py",
    "build/",
    "dist/",
    ".tox/",
    "venv/",
    ".venv/",
    "__pycache__/"
]

# Warnings configuration
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore::urllib3.exceptions.InsecureRequestWarning

# Asyncio configuration
asyncio_mode = auto

# Timeout configuration (prevent hanging tests)
timeout = 300
timeout_method = thread

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto
